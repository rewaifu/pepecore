[package]
name = "pepecore"
version = "0.5.0"
edition.workspace = true
publish = true
repository = "https://github.com/rewaifu/pepecore"
license = "MIT"
readme = "../README.md"
authors = ["rewaifu"]
description = "A Rust library for image decoding, encoding, and processing using an efficient SVec data structure."
#homepage = ""
documentation = "https://docs.rs/crate/pepecore"
categories = ["multimedia::images"]
keywords = ["halftone", "screentone", "cvt_color"]

[dependencies]
filebuffer = "1.0.1"
image = "0.25.10"
pepecore-array.workspace = true
thiserror = "2.0.21"
zune-core = "0.5.3"
zune-jpegxl = "0.5.2"
# zune-psd = "0.5.0-rc0"
fastnoise-lite = "1.1.1"
jpeg-encoder = { version = "0.7.1", features = ["simd"], optional = true }
fast_image_resize = "6.1.0"
rayon = "1.12.0"
once_cell = "1.21.4"
biski64 = "0.3.2"
rand = "0.9.2"
ahash = "0.8.12"
photocraft-psd = { git = "https://github.com/storytold/photocraft.git" }
[features]
encode = ["dep:jpeg-encoder"]
